<!DOCTYPE html>
<html>
<body>

<h2>Email Automation System</h2>

<form id="process-form">
  <input id="subject" placeholder="Subject" style="width: 100%;"><br><br>
  <textarea id="body" placeholder="Message" style="width: 100%; height: 120px;"></textarea><br><br>
  <button type="submit">Process Email</button>
</form>

<hr>

<form id="label-form">
  <input id="msg-id" placeholder="Message ID" style="width: 100%;"><br><br>
  <input id="label" placeholder="Label to add" style="width: 100%;"><br><br>
  <button type="submit">Apply Label</button>
</form>

<hr>

<form id="forward-settings-form">
  <input id="forward-to" placeholder="Forward to email address" style="width: 100%;"><br><br>
  <button type="submit">Save Forward Address</button>
</form>

<form id="forward-form">
  <input id="forward-msg-id" placeholder="Message ID to forward" style="width: 100%;"><br><br>
  <button type="submit">Forward Message</button>
</form>

<pre id="result" style="white-space: pre-wrap; background: #f3f3f3; padding: 12px; border-radius: 6px;"></pre>

<script src="script.js"></script>

</body>
</html>
